services:
  - type: web
    name: fifa-wc2026-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LEAGUE_ID
        value: "1"
      - key: SEASON
        value: "2026"
      - key: FOOTBALL_DATA_COMPETITION_ID
        value: "2000"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
