services:
  - type: web
    name: fifa-wc2026-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LEAGUE_ID
        value: "1"
      - key: SEASON
        value: "2026"
      - key: FOOTBALL_DATA_COMPETITION_ID
        value: "2000"
      - key: DB_PATH
        value: data/football.db
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
